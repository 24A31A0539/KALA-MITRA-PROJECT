<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360" opacity="0.35">
  <defs>
    <!-- Biscuit & Light Brown Palettes -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89666" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8C533C" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Weave Grid Texture Overlay in Biscuit Tone -->
  <pattern id="loomWeave" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M0 10 L20 10 M10 0 L10 20" stroke="#DFCCA6" stroke-width="0.75" stroke-dasharray="2 3"/>
  </pattern>
  <rect width="360" height="360" fill="url(#loomWeave)" opacity="0.6"/>

  <!-- 1. Traditional Clay Pottery Motif (Top-Left) -->
  <g transform="translate(45, 50)" fill="none" stroke="#9A6138" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Earthen Pot / Kalash -->
    <ellipse cx="25" cy="14" rx="14" ry="4" fill="#E8D5B5" fill-opacity="0.4"/>
    <path d="M11 14 C11 26, 0 34, 0 52 C0 68, 50 68, 50 52 C50 34, 39 26, 39 14" fill="#DEC098" fill-opacity="0.35"/>
    <ellipse cx="25" cy="50" rx="18" ry="6" stroke-dasharray="3 3"/>
    <path d="M15 36 Q25 42 35 36" stroke="#844D25"/>
    <!-- Pottery Carving / Geometric Dots -->
    <circle cx="20" cy="44" r="1.5" fill="#9A6138"/>
    <circle cx="25" cy="45" r="2" fill="#9A6138"/>
    <circle cx="30" cy="44" r="1.5" fill="#9A6138"/>
  </g>

  <!-- 2. Traditional Handloom Shuttle / Weaver Motif (Top-Right) -->
  <g transform="translate(235, 45)" fill="none" stroke="#8C533C" stroke-width="1.8" stroke-linecap="round">
    <!-- Handloom shuttle -->
    <path d="M5 25 Q35 5 65 25 Q35 45 5 25 Z" fill="#E3CDA9" fill-opacity="0.35"/>
    <ellipse cx="35" cy="25" rx="12" ry="5" fill="#FAF3E0" fill-opacity="0.6" stroke="#A66F48"/>
    <line x1="26" y1="25" x2="44" y2="25" stroke="#8C533C" stroke-width="2"/>
    <!-- Thread lines -->
    <path d="M35 20 Q50 10 70 8" stroke="#B88655" stroke-dasharray="2 2"/>
    <path d="M35 30 Q50 40 70 42" stroke="#B88655" stroke-dasharray="2 2"/>
  </g>

  <!-- 3. Kalamkari Paisley / Mango Motif (Center) -->
  <g transform="translate(145, 140)" fill="none" stroke="#9A6138" stroke-width="1.8" stroke-linejoin="round">
    <path d="M35 10 C18 10, 10 28, 10 44 C10 65, 32 75, 46 62 C58 50, 60 28, 48 16 C42 10, 36 6, 42 0 C30 0, 20 6, 35 10 Z" fill="#EADBC8" fill-opacity="0.4"/>
    <!-- Inner Paisley Floral Details -->
    <circle cx="32" cy="42" r="7" fill="#DFC7A2" fill-opacity="0.5" stroke="#7A4320"/>
    <path d="M28 42 Q32 36 36 42 Q32 48 28 42 Z" fill="#8C533C"/>
    <circle cx="20" cy="52" r="2" fill="#9A6138"/>
    <circle cx="44" cy="52" r="2" fill="#9A6138"/>
    <circle cx="32" cy="26" r="2" fill="#9A6138"/>
  </g>

  <!-- 4. Woodcraft & Block Print Floral Motif (Bottom-Left) -->
  <g transform="translate(50, 235)" fill="none" stroke="#844D25" stroke-width="1.6">
    <!-- Block print 8-petal craft flower -->
    <circle cx="30" cy="30" r="6" fill="#8C533C"/>
    <ellipse cx="30" cy="14" rx="5" ry="9" fill="#E8D5B5" fill-opacity="0.4"/>
    <ellipse cx="30" cy="46" rx="5" ry="9" fill="#E8D5B5" fill-opacity="0.4"/>
    <ellipse cx="14" cy="30" rx="9" ry="5" fill="#E8D5B5" fill-opacity="0.4"/>
    <ellipse cx="46" cy="30" rx="9" ry="5" fill="#E8D5B5" fill-opacity="0.4"/>
    <!-- Diagonal petals -->
    <ellipse cx="19" cy="19" rx="8" ry="4" transform="rotate(-45 19 19)" fill="#DEC098" fill-opacity="0.3"/>
    <ellipse cx="41" cy="41" rx="8" ry="4" transform="rotate(-45 41 41)" fill="#DEC098" fill-opacity="0.3"/>
    <ellipse cx="41" cy="19" rx="8" ry="4" transform="rotate(45 41 19)" fill="#DEC098" fill-opacity="0.3"/>
    <ellipse cx="19" cy="41" rx="8" ry="4" transform="rotate(45 19 41)" fill="#DEC098" fill-opacity="0.3"/>
    <!-- Craft dot ring -->
    <circle cx="30" cy="30" r="26" stroke="#C49B71" stroke-dasharray="3 4"/>
  </g>

  <!-- 5. Metal Craft & Brass Chimes / Artisan Tools Motif (Bottom-Right) -->
  <g transform="translate(240, 240)" fill="none" stroke="#9A6138" stroke-width="1.8" stroke-linecap="round">
    <!-- Artisan Chisels / Carving tool and Brass Bell -->
    <path d="M12 12 L38 38" stroke="#8C533C" stroke-width="2.5"/>
    <path d="M38 38 L44 44 L40 48 L34 44 Z" fill="#DEC098" stroke="#7A4320"/>
    <path d="M12 12 L8 8 L14 4 L18 8 Z" fill="#8C533C"/>
    <!-- Brass Bell / Heritage craft bell -->
    <path d="M45 12 C45 6, 25 6, 25 12 L22 24 L48 24 Z" fill="#E3CDA9" fill-opacity="0.4" stroke="#9A6138"/>
    <circle cx="35" cy="27" r="2.5" fill="#8C533C"/>
  </g>

  <!-- Subtle connecting artisan heritage dots and filigree -->
  <g fill="#A66F48" opacity="0.4">
    <circle cx="10" cy="180" r="2"/>
    <circle cx="20" cy="180" r="1.5"/>
    <circle cx="340" cy="180" r="2"/>
    <circle cx="350" cy="180" r="1.5"/>
    <circle cx="180" cy="20" r="2"/>
    <circle cx="180" cy="340" r="2"/>
  </g>
</svg>
